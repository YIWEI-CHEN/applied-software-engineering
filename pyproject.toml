[project]
name = "applied-software-engineering"
version = "0.1.0"
description = "ASE practice: kitchen prep-time API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitchen_prep"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
